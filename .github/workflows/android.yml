name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK"
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SDKM=$(ls -1d "${ANDROID_HOME:-$SDK}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)
          if [ -z "$SDKM" ]; then
            SDKM=$(ls -1d "${ANDROID_HOME:-$SDK}"/cmdline-tools/bin/sdkmanager 2>/dev/null | tail -n1)
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools"
          echo "sdk.dir=${ANDROID_HOME:-$SDK}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test --stacktrace

      - name: Decode debug keystore
        env:
          VL_DEBUG_KEYSTORE_B64: ${{ secrets.VL_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${VL_DEBUG_KEYSTORE_B64}" ]; then
            echo "GitHub secret VL_DEBUG_KEYSTORE_B64 is not set"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$VL_DEBUG_KEYSTORE_B64" | base64 -d > keystore/victorlaunch-debug.jks
          test -s keystore/victorlaunch-debug.jks

      - name: Assemble debug APK
        env:
          VL_DEBUG_STORE_PASSWORD: ${{ secrets.VL_DEBUG_STORE_PASSWORD }}
          VL_DEBUG_KEY_ALIAS: ${{ secrets.VL_DEBUG_KEY_ALIAS }}
          VL_DEBUG_KEY_PASSWORD: ${{ secrets.VL_DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: victorlaunch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish debug-latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(ls -1 app/build/outputs/apk/debug/*.apk | head -n1)
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest "$APK" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug latest (${GITHUB_SHA::7})" \
            --notes "Debug build of ${GITHUB_SHA} from main. Private repo: sign in to GitHub to download."
